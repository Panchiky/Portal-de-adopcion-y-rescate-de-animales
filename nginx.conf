server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Rutas de React Router (por ejemplo /catalogo): si el archivo no existe se entrega index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los archivos compilados llevan un hash en el nombre, así que se pueden guardar en caché
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
